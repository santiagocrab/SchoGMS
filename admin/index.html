    <script>
        $(".preloader ").fadeOut();
        
        // Check for error messages in URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        
        // Check if there's an error message
        var errorMsg = getUrlParameter('error');
        if (errorMsg) {
            document.getElementById('error-text').textContent = errorMsg;
            document.getElementById('error-message').style.display = 'block';
        }
        
        // Form validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            var username = document.getElementById('uname').value.trim();
            var password = document.getElementById('pwd').value;
            
            if (!username || !password) {
                e.preventDefault();
                document.getElementById('error-text').textContent = 'Please enter both username and password';
                document.getElementById('error-message').style.display = 'block';
                return false;
            }
        });
    </script>
